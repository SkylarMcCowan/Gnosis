name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install system audio dependency for pyaudio
        run: sudo apt-get update && sudo apt-get install -y portaudio19-dev

      - name: Install system libraries for headless PyQt6 (offscreen platform)
        run: sudo apt-get install -y libegl1 libxkbcommon0 libxkbcommon-x11-0 libdbus-1-3

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Check for syntax errors
        run: python -m compileall -q -x '/venv/' .

      - name: Run tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: pytest -q
